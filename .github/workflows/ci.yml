name: CI
on:
  push:
    branches: [main]
  pull_request:

# the tests only read the code
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # setup-ffmpeg only has Intel builds for macOS; the macOS runners are Apple Silicon, so Homebrew there
      - uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3, pinned: a third-party action
        if: runner.os != 'macOS'
      - run: brew install ffmpeg
        if: runner.os == 'macOS'
      - run: node --version && ffmpeg -version
      - run: npm test

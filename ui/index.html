<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LetzAI Hybrid Filmmaker Kit</title>
  <meta name="color-scheme" content="dark light">
  <!-- The LetzAI L, the official app icon file unchanged (see docs/BRANDING.md). -->
  <link rel="icon" type="image/png" href="/img/letzai-l.png">
  <!-- Inter for the product, Space Grotesk for the welcome headline. Both degrade to the system font offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600&display=swap">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/views.css">
</head>
<body>
  <div id="app" class="no-project">
    <header class="topbar" id="topbar"></header>
    <nav class="rail" id="rail" aria-label="Main"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <noscript>This tool needs JavaScript.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
